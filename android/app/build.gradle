plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file("key.properties")
if (keyPropertiesFile.exists()) keyPropertiesFile.withInputStream { keyProperties.load(it) }

def signingValue = { String propertyName, String environmentName ->
    keyProperties.getProperty(propertyName) ?: System.getenv(environmentName)
}
def releaseStoreFile = signingValue("storeFile", "ANDROID_KEYSTORE_PATH")
def releaseStorePassword = signingValue("storePassword", "ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = signingValue("keyAlias", "ANDROID_KEY_ALIAS")
def releaseKeyPassword = signingValue("keyPassword", "ANDROID_KEY_PASSWORD")
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.isBlank() }

android {
    namespace "com.padoshah.abzarfile"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = JavaVersion.VERSION_17.toString() }

    defaultConfig {
        applicationId "com.padoshah.abzarfile"
        minSdk 23
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        ndk { abiFilters "armeabi-v7a", "arm64-v8a", "x86_64" }
        externalNativeBuild {
            cmake { arguments "-DABZAR_BUILD_TESTS=OFF", "-DABZAR_USE_SYSTEM_ZLIB=OFF"; cppFlags "-std=c++20" }
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    externalNativeBuild { cmake { path file("../../native/CMakeLists.txt"); version "3.22.1" } }
    packagingOptions { jniLibs { useLegacyPackaging = false } }
}

flutter { source "../.." }
