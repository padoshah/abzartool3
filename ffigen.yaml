name: AbzarBindings
description: Generated bindings for the stable AbzarFile C ABI.
output: lib/core/native/abzar_bindings.g.dart
headers:
  entry-points:
    - native/include/abzar/abzar_api.h
  include-directives:
    - native/include/abzar/abzar_api.h
compiler-opts:
  - -Inative/include
functions:
  include:
    - abz_.*
structs:
  include:
    - Abz.*
