name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build zlib1g-dev libtesseract-dev libleptonica-dev tesseract-ocr-eng tesseract-ocr-fas libopencv-core-dev libopencv-imgproc-dev
      - name: Resolve packages and generate sources
        run: |
          run_step() {
            local label="$1"; shift
            if ! "$@" > step_output.txt 2>&1; then
              local ec=$?
              echo "::error::${label} failed with exit code ${ec}"
              tail -c 3000 step_output.txt | while IFS= read -r line; do
                safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
                echo "::error::${safe}"
              done
              exit "$ec"
            fi
          }
          run_step "flutter pub get" flutter pub get
          run_step "flutter gen-l10n" flutter gen-l10n
          run_step "dart run ffigen" dart run ffigen --config ffigen.yaml
          if ! git diff --exit-code -- lib/core/native/abzar_bindings.g.dart > diff_output.txt 2>&1; then
            echo "::error::committed abzar_bindings.g.dart no longer matches a fresh ffigen run"
            tail -c 3000 diff_output.txt | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error::${safe}"
            done
            exit 1
          fi
      - name: Check Dart syntax and formatting
        run: dart format --output=none lib test integration_test tool
      - name: Analyze
        run: |
          set +e
          flutter analyze > flutter_analyze_output.txt 2>&1
          code=$?
          set -e
          cat flutter_analyze_output.txt
          if [ "$code" -ne 0 ]; then
            # flutter analyze's human-readable format is:
            #   error/warning/info • message • file:line:col • rule_name
            grep -E '^\s*(error|warning|info)\s•' flutter_analyze_output.txt | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
              lvl="notice"
              case "$line" in
                error\ •*) lvl="error" ;;
                warning\ •*) lvl="warning" ;;
              esac
              echo "::${lvl}::${safe}"
            done
            # Fallback: if nothing matched that pattern (format differs), emit the
            # tail of the raw output so there's still SOMETHING to read via the API.
            if ! grep -qE '^\s*(error|warning|info)\s•' flutter_analyze_output.txt; then
              tail -c 3000 flutter_analyze_output.txt | while IFS= read -r line; do
                safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
                echo "::error::${safe}"
              done
            fi
          fi
          exit $code
      - name: Flutter tests
        run: flutter test
      - name: Build and test native core
        run: |
          cmake -S native -B native/build-ci -G Ninja -DABZAR_BUILD_TESTS=ON -DABZAR_ENABLE_OCR=ON
          cmake --build native/build-ci
          ABZAR_REQUIRE_FULL_FEATURES=1 ctest --test-dir native/build-ci --output-on-failure
      - name: Verify matrix and release-name contract
        run: dart run tool/verify_outputs.dart
      - name: Build Android debug APK
        run: flutter build apk --debug

  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Enable Windows and resolve generated sources
        shell: pwsh
        run: |
          function Run-Step($label, [scriptblock]$cmd) {
            $global:LASTEXITCODE = 0
            $output = & $cmd 2>&1
            $ec = $LASTEXITCODE
            if ($ec -ne 0) {
              Write-Output "::error::$label failed with exit code $ec"
              $output | Select-Object -Last 60 | ForEach-Object {
                $line = ($_ -replace '%','%25' -replace "`r",'%0D')
                if ($line) { Write-Output "::error::$line" }
              }
              exit $ec
            }
          }
          Run-Step "flutter config" { flutter config --enable-windows-desktop }
          Run-Step "flutter pub get" { flutter pub get }
          Run-Step "flutter gen-l10n" { flutter gen-l10n }
          Run-Step "dart run ffigen" { dart run ffigen --config ffigen.yaml }
      - name: Analyze and test on Windows
        run: |
          flutter analyze
          flutter test
      - name: Windows build diagnostics
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $installs = & $vswhere -all -products * -format json | ConvertFrom-Json
            if ($installs.Count -eq 0) {
              Write-Output "::warning::vswhere found no Visual Studio instances at all"
            }
            foreach ($inst in $installs) {
              Write-Output "::notice::VS instance: $($inst.displayName) v$($inst.installationVersion) at $($inst.installationPath)"
            }
          } else {
            Write-Output "::warning::vswhere.exe not found at $vswhere"
          }
          $doctor = flutter doctor -v 2>&1 | Out-String
          $doctor -split "`n" | Where-Object { $_ -match "Visual Studio|Windows|CMake" } | ForEach-Object {
            $line = ($_ -replace '%','%25' -replace "`r",'%0D').Trim()
            if ($line) { Write-Output "::notice::$line" }
          }

      - name: Build Windows debug bundle
        shell: pwsh
        run: |
          flutter build windows --debug -v 2>&1 | Tee-Object -FilePath build_output.txt | Out-Null
          $code = $LASTEXITCODE
          $lines = Get-Content build_output.txt
          # Prioritize genuinely fatal markers over noisy but harmless
          # "Could NOT find X" notices OpenCV emits routinely for optional
          # 3rdparty libs -- those drowned out the real error last time.
          $fatalPattern = "CMake Error|FAILED:|error C\d|error MSB|Error(?!\s+E\d)"
          $anyFatal = $false
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $fatalPattern) {
              $anyFatal = $true
              $context = $lines[$i..[Math]::Min($i+6, $lines.Count-1)] -join ' | '
              $context = ($context -replace '%','%25' -replace "`r",'%0D')
              Write-Output "::error::$context"
            }
          }
          if (-not $anyFatal -and $code -ne 0) {
            Write-Output "::error::no fatal-pattern match found; dumping last 25 lines of raw output"
            $lines | Select-Object -Last 25 | ForEach-Object {
              $line = ($_ -replace '%','%25' -replace "`r",'%0D')
              if ($line) { Write-Output "::error::$line" }
            }
          }
          if ($code -ne 0) {
            Write-Output "::error::flutter build windows failed, exit code $code"
            exit $code
          }
        env:
          CMAKE_GENERATOR: "Visual Studio 17 2022"
