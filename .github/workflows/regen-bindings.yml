name: Regenerate ffi bindings (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Resolve packages and regenerate bindings
        run: |
          flutter pub get
          flutter gen-l10n
          dart run ffigen --config ffigen.yaml

      - name: Show what changed
        run: |
          git status --short
          git diff --stat || true

      - name: Commit regenerated bindings + lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/core/native/abzar_bindings.g.dart pubspec.lock
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: regenerate ffi bindings + commit pubspec.lock (produced by real Flutter 3.29.3, dispatched by Claude; pins ffigen version to fix non-reproducible codegen)"
            git push origin HEAD:main
          fi
