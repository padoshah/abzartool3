name: abzarfile
description: Offline-first file converter, editor, and document toolbox for Android and Windows.
publish_to: none
version: 1.0.0+10000

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  ffi: ^2.1.4
  file_picker: ^8.3.7
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.2
  drift: ^2.25.1
  sqlite3_flutter_libs: ^0.5.30
  http: ^1.3.0
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  desktop_drop: ^0.5.0
  cross_file: ^0.3.4+2
  package_info_plus: ^8.3.0
  open_filex: ^4.7.0
  share_plus: ^10.1.4
  dynamic_color: ^1.7.0
  camera: ^0.11.1
  image_picker: ^1.1.2
  image: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  ffigen: any
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/config/
    - assets/icons/
    - assets/images/
    - assets/ocr/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Variable.ttf
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Variable.ttf
    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript-Variable.ttf
